version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: paper-reproducibility
    env_file: .env
    ports:
      - 127.0.0.1:5000:5000
    environment:
      # Python path (application source is in src/)
      - PYTHONPATH=/app/src
    
    volumes:
      # Docker-in-Docker: allow container to spawn other containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist database and uploads
      - ./data:/app/data
      # Live code reload for development
      - .:/app
    
    networks:
      - repro-network

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.repro.rule=Host(`repro.selene.local`)"
    #   - "traefik.http.routers.repro.entrypoints=web"
    #   - "traefik.http.services.repro.loadbalancer.server.port=5000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  repro-network:
    name: repro-network
