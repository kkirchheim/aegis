version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: paper-reproducibility
    env_file: .env
    ports:
      - 127.0.0.1:5000:5000
    environment:
      # Flask Configuration
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      
      # Docker Configuration
      - DOCKER_NETWORK=repro-network
      - DOCKER_BACKEND_URL=http://paper-reproducibility:5000
      
      # LLM Provider Configuration
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_MODEL=claude-haiku-4-5
      
      # Agent Configuration
      - AGENT_CONTEXT_LIMIT=100000
      
      # Admin Credentials (optional — random password generated if unset)
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=changeme
      - ADMIN_EMAIL=admin@example.com

      # Caching Configuration
      - ENABLE_CACHING=false
    
    volumes:
      # Docker-in-Docker: allow container to spawn other containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist database and uploads
      - ./data:/app/data
      # Live code reload for development
      # - .:/app
    
    networks:
      - repro-network

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.repro.rule=Host(`repro.selene.local`)"
    #   - "traefik.http.routers.repro.entrypoints=web"
    #   - "traefik.http.services.repro.loadbalancer.server.port=5000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  repro-network:
    name: repro-network
