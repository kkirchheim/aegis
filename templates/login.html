<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Paper Reproducibility Checker</title>
    
    <!-- Tailwind CSS + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.3/dist/full.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* Override primary color to blue */
        .text-primary { color: #0068b4; }
        .bg-primary { background-color: #0068b4; }
        .btn-primary { background-color: #0068b4; border-color: #0068b4; color: white; }
        .btn-primary:hover { background-color: #004d8f; }
        .btn-primary:disabled { background-color: #0068b4; border-color: #0068b4; color: white; }
    </style>
</head>
<body class="bg-base-100">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="card bg-base-100 shadow-lg max-w-md w-full">
            <div class="card-body">
                <h1 class="card-title text-2xl gap-2">
                    <span>📄</span>
                    <span>Log In</span>
                </h1>
                
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="label">
                            <span class="label-text">Username</span>
                        </label>
                        <input type="text" id="username" name="username" placeholder="Enter username" class="input input-bordered w-full" required />
                    </div>
                    
                    <div>
                        <label class="label">
                            <span class="label-text">Password</span>
                        </label>
                        <input type="password" id="password" name="password" placeholder="Enter password" class="input input-bordered w-full" required />
                    </div>
                    
                    <div id="errorMessage" class="alert alert-error hidden" role="alert">
                        <span id="errorText"></span>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-full gap-2">
                        <span>🔐</span>
                        <span>Log In</span>
                    </button>
                </form>
                
                <div class="divider">or</div>
                
                <p class="text-center text-sm">
                    Don't have an account?
                    <a href="/register" class="link link-primary">Create one</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    document.getElementById('errorMessage').classList.remove('hidden');
                    document.getElementById('errorText').textContent = data.error || 'Login failed';
                    return;
                }
                
                window.location.href = data.redirect || '/';
            } catch (error) {
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('errorText').textContent = 'An error occurred: ' + error.message;
            }
        });
    </script>
</body>
</html>
