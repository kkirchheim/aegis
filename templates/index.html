<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Reproducibility Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Paper Reproducibility Checker</h1>
            <p>Upload a scientific paper to analyze its reproducibility</p>
        </header>

        <main>
            <!-- Upload Section -->
            <section id="uploadSection" class="section">
                <h2>1. Upload Paper</h2>
                <div class="upload-area">
                    <input type="file" id="pdfInput" accept=".pdf" />
                    <label for="pdfInput" class="upload-label">
                        <span class="upload-icon">📤</span>
                        <span>Click to upload PDF or drag and drop</span>
                    </label>
                </div>
                <button id="analyzeBtn" class="btn btn-primary" disabled>
                    Analyze Paper
                </button>
            </section>

            <!-- Progress Section -->
            <section id="progressSection" class="section" style="display: none;">
                <h2>2. Analysis Progress</h2>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <p id="progressText" class="progress-text">Starting...</p>

                <div class="log-container">
                    <h3>Live Log</h3>
                    <div id="progressLog" class="log"></div>
                </div>
            </section>

            <!-- Report Section -->
            <section id="reportSection" class="section" style="display: none;">
                <h2>3. Reproducibility Report</h2>
                <div id="reportContent" class="report-content"></div>
            </section>

            <!-- Jobs History -->
            <section id="historySection" class="section">
                <h2>Previous Analyses</h2>
                <div id="jobsList" class="jobs-list">
                    <p id="noJobs" class="empty-state">No previous analyses yet</p>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
