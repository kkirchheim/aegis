<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Reproducibility Checker</title>
    
    <!-- Tailwind CSS + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.3/dist/full.css" rel="stylesheet" type="text/css" />
    
    <!-- Custom styles -->
    <style>
        /* Override primary color to blue */
        .text-primary { color: #0068b4; }
        .bg-primary { background-color: #0068b4; }
        .btn-primary { background-color: #0068b4; border-color: #0068b4; color: white; }
        .btn-primary:hover { background-color: #004d8f; }
        .badge-primary { background-color: #0068b4; border-color: #0068b4; color: white; }
        .link-primary { color: #0068b4; }
        
        /* Secondary button red */
        .btn-secondary { background-color: #ef4444; border-color: #ef4444; color: white; }
        .btn-secondary:hover { background-color: #dc2626; }
        
        /* Progress bar */
        .progress-primary { background-color: #0068b4; }
        .progress-primary::-webkit-progress-value { background-color: #0068b4; }
        .progress-primary::-moz-progress-bar { background-color: #0068b4; }
        
        /* Steps component */
        .step-primary { background-color: #0068b4; }
        .step-primary::before, .step-primary::after { background-color: #0068b4; }
        
        /* Progress bar primary color */
        .progress-primary {
            background-color: #0068b4 !important;
        }
        
        .progress-primary::-webkit-progress-bar {
            background-color: #0068b4 !important;
        }
        
        .progress-primary::-webkit-progress-value {
            background-color: #0068b4 !important;
        }
        
        .progress-primary::-moz-progress-bar {
            background-color: #0068b4 !important;
        }
        
        /* Override any violet/accent color to blue */
        .badge-accent, .btn-accent, [class*="accent"] {
            background-color: #0068b4 !important;
            border-color: #0068b4 !important;
            color: white !important;
        }
        
        .badge-accent:hover, .btn-accent:hover {
            background-color: #004d8f !important;
            border-color: #004d8f !important;
        }
        
        /* Override any element with background-color of violet to blue */
        [style*="background-color: rgb(148, 0, 255)"],
        [style*="background-color:#9400ff"],
        [style*="background-color: #9400ff"] {
            background-color: #0068b4 !important;
        }
        
        html[data-theme="light"] {
            color-scheme: light;
        }
        
        .upload-area {
            @apply relative border-2 border-dashed border-primary rounded-lg p-8 text-center cursor-pointer transition-all hover:border-primary/80 hover:bg-primary/5;
        }
        
        .upload-area.dragover {
            @apply border-primary/80 bg-primary/10;
        }
        
        #pdfInput {
            @apply hidden;
        }
    </style>
</head>
<body class="bg-base-100">
    {% include 'navbar.html' %}

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        
        <!-- Hero Section -->
        <section class="mb-12 text-center">
            <h1 class="text-4xl font-bold mb-4">Analyze Your Paper's Reproducibility</h1>
            <p class="text-xl text-base-content/70 mb-8">
                Upload a scientific paper and get an instant reproducibility assessment across 15 metrics.
            </p>
        </section>

        <!-- Upload Section -->
        <section id="uploadSection" class="mb-8">
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title flex items-center gap-2">
                        <span>📤</span>
                        <span>Upload PDF</span>
                    </h2>
                    
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="pdfInput" accept=".pdf" style="display: none;" />
                        <label for="pdfInput" class="upload-label cursor-pointer flex flex-col items-center justify-center w-full h-64">
                            <div class="text-7xl">📑</div>
                        </label>
                    </div>
                    
                    <div class="card-actions justify-end mt-4">
                        <button id="analyzeBtn" class="btn btn-primary gap-2" disabled>
                            <span>🔍</span>
                            <span>Analyze Paper</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Progress Section -->
        <section id="progressSection" class="mb-8" style="display: none;">
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title flex items-center gap-2">
                        <span>⚙️</span>
                        <span>Analysis Progress</span>
                    </h2>
                    
                    <div class="flex items-center gap-4 my-4">
                        <progress id="progressFill" class="progress progress-primary flex-1" value="0" max="100"></progress>
                        <span id="progressText" class="text-sm font-semibold text-base-content/60">0%</span>
                    </div>
                    
                    <!-- Stages Timeline -->
                    <div class="my-4 p-4 bg-base-200 rounded-lg">
                        <div class="grid grid-cols-3 gap-4">
                            <div id="stage1" class="flex flex-col items-center">
                                <div class="text-2xl mb-1" id="stage1Icon">○</div>
                                <div class="text-xs font-semibold text-center">📄 Paper</div>
                                <div class="text-xs text-base-content/60" id="stage1Time"></div>
                            </div>
                            <div id="stage2" class="flex flex-col items-center">
                                <div class="text-2xl mb-1" id="stage2Icon">○</div>
                                <div class="text-xs font-semibold text-center">⚙️ Execution</div>
                                <div class="text-xs text-base-content/60" id="stage2Time"></div>
                            </div>
                            <div id="stage3" class="flex flex-col items-center">
                                <div class="text-2xl mb-1" id="stage3Icon">○</div>
                                <div class="text-xs font-semibold text-center">📊 Evaluation</div>
                                <div class="text-xs text-base-content/60" id="stage3Time"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="divider my-2"></div>
                    
                    <h3 class="font-semibold mb-2">Live Log</h3>
                    <div id="progressLog" class="bg-base-200 rounded-lg p-4 font-mono text-sm max-h-96 overflow-y-auto">
                        <div class="text-base-content/50">Waiting for analysis to start...</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Report Section -->
        <section id="reportSection" class="mb-8" style="display: none;">
            <div id="reportContent"></div>
        </section>

    </div>

    <!-- Theme Toggle Script -->
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    </script>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
