<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Reproducibility Checker</title>
    
    <!-- Tailwind CSS + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.3/dist/full.css" rel="stylesheet" type="text/css" />
    
    <!-- Custom styles -->
    <style>
        :root {
            --primary: #ffa500;
            --secondary: #4ade80;
            --accent: #f87171;
        }
        
        html[data-theme="light"] {
            color-scheme: light;
        }
        
        .upload-area {
            @apply relative border-2 border-dashed border-primary rounded-lg p-8 text-center cursor-pointer transition-all hover:border-primary/80 hover:bg-primary/5;
        }
        
        .upload-area.dragover {
            @apply border-primary/80 bg-primary/10;
        }
        
        #pdfInput {
            @apply hidden;
        }
    </style>
</head>
<body class="bg-base-100">
    <!-- Header -->
    <div class="navbar bg-base-200 shadow-md sticky top-0 z-50">
        <div class="flex-1 px-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span>📄</span>
                <span class="text-primary">Paper Reproducibility</span>
                <span>Checker</span>
            </h1>
        </div>
        <div class="flex-none px-4">
            <button class="btn btn-sm btn-ghost" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        
        <!-- Upload Section -->
        <section id="uploadSection" class="mb-8">
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title flex items-center gap-2">
                        <span>1️⃣</span>
                        <span>Upload Paper</span>
                    </h2>
                    
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="pdfInput" accept=".pdf" />
                        <label for="pdfInput" class="upload-label cursor-pointer">
                            <div class="text-5xl mb-2">📤</div>
                            <div class="text-lg font-semibold">Click to upload PDF</div>
                            <div class="text-sm text-base-content/60">or drag and drop</div>
                        </label>
                    </div>
                    
                    <div class="card-actions justify-end mt-4">
                        <button id="analyzeBtn" class="btn btn-primary gap-2" disabled>
                            <span>🔍</span>
                            <span>Analyze Paper</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Progress Section -->
        <section id="progressSection" class="mb-8" style="display: none;">
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title flex items-center gap-2">
                        <span>2️⃣</span>
                        <span>Analysis Progress</span>
                    </h2>
                    
                    <div class="flex items-center gap-4 my-4">
                        <progress id="progressFill" class="progress progress-primary flex-1" value="0" max="100"></progress>
                        <span id="progressText" class="text-sm font-semibold text-base-content/60">0%</span>
                    </div>
                    
                    <div class="divider my-2"></div>
                    
                    <h3 class="font-semibold mb-2">Live Log</h3>
                    <div id="progressLog" class="bg-base-200 rounded-lg p-4 font-mono text-sm max-h-96 overflow-y-auto">
                        <div class="text-base-content/50">Waiting for analysis to start...</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Report Section -->
        <section id="reportSection" class="mb-8" style="display: none;">
            <div id="reportContent"></div>
        </section>

        <!-- Jobs History -->
        <section id="historySection" class="mb-8">
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title flex items-center gap-2">
                        <span>📚</span>
                        <span>Previous Analyses</span>
                    </h2>
                    
                    <div id="jobsList" class="space-y-2">
                        <div id="noJobs" class="text-center py-8 text-base-content/60">
                            <p>No previous analyses yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- Theme Toggle Script -->
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    </script>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
