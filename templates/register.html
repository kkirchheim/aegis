<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Paper Reproducibility Checker</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-family='system-ui'>📄</text></svg>">
    
    <!-- Tailwind CSS + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.3/dist/full.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* Override primary color to blue */
        .text-primary { color: #0068b4; }
        .bg-primary { background-color: #0068b4; }
        .btn-primary { background-color: #0068b4; border-color: #0068b4; color: white; }
        .btn-primary:hover { background-color: #004d8f; }
        .btn-primary:disabled { background-color: #0068b4; border-color: #0068b4; color: white; }
        .badge-primary { background-color: #0068b4; border-color: #0068b4; color: white; }
        .link-primary { color: #0068b4; }
        
        /* Dark mode specific styles for better readability */
        html[data-theme="dark"] .input,
        html[data-theme="dark"] .input:focus {
            background-color: #2a2a2a;
            border-color: #444;
            color: #e0e0e0;
        }
        
        html[data-theme="dark"] .input::placeholder {
            color: #999;
        }
        
        html[data-theme="dark"] .label-text {
            color: #e0e0e0;
        }
        
        html[data-theme="dark"] .divider {
            background-color: #444;
            color: #999;
        }
        
        html[data-theme="dark"] .link {
            color: #0068b4;
        }
        
        html[data-theme="dark"] .link:hover {
            color: #0080d4;
        }
        
        /* Theme toggle button */
        .theme-toggle-btn {
            @apply btn btn-sm btn-ghost gap-2;
        }
    </style>
</head>
<body class="bg-base-100">
    <!-- Theme Toggle Button (Top Right) -->
    <button class="theme-toggle-btn fixed top-4 right-4 z-50" onclick="toggleTheme()" title="Toggle dark/light mode">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="min-h-screen flex items-center justify-center px-4 pt-20">
        <div class="card bg-base-100 shadow-lg max-w-md w-full">
            <div class="card-body">
                <h1 class="card-title text-2xl gap-2">
                    <span>📄</span>
                    <span>Create Account</span>
                </h1>
                
                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="label">
                            <span class="label-text">Username</span>
                        </label>
                        <input type="text" id="username" name="username" placeholder="Enter username" class="input input-bordered w-full" required minlength="3" />
                    </div>
                    
                    <div>
                        <label class="label">
                            <span class="label-text">Email</span>
                        </label>
                        <input type="email" id="email" name="email" placeholder="Enter email" class="input input-bordered w-full" required />
                    </div>
                    
                    <div>
                        <label class="label">
                            <span class="label-text">Password</span>
                        </label>
                        <input type="password" id="password" name="password" placeholder="Enter password" class="input input-bordered w-full" required minlength="8" />
                        <p class="text-xs text-base-content/60 mt-1">At least 8 characters</p>
                    </div>
                    
                    <div>
                        <label class="label">
                            <span class="label-text">Confirm Password</span>
                        </label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" class="input input-bordered w-full" required minlength="8" />
                    </div>
                    
                    <div id="errorMessage" class="alert alert-error hidden" role="alert">
                        <span id="errorText"></span>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-full gap-2">
                        <span>✓</span>
                        <span>Create Account</span>
                    </button>
                </form>
                
                <div class="divider">or</div>
                
                <p class="text-center text-sm">
                    Already have an account?
                    <a href="/login" class="link link-primary">Log in</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        // Theme Toggle Function
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
        
        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    document.getElementById('errorMessage').classList.remove('hidden');
                    document.getElementById('errorText').textContent = data.error || 'Registration failed';
                    return;
                }
                
                window.location.href = data.redirect || '/';
            } catch (error) {
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('errorText').textContent = 'An error occurred: ' + error.message;
            }
        });
    </script>
</body>
</html>
