<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Reproducibility Checker</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-family='system-ui'>📄</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.0.0/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="bg-base-100">
    {% include "navbar.html" %}

    <div class="flex items-center justify-center min-h-[calc(100vh-80px)]">
        <div class="card w-96 bg-base-200 shadow-lg">
            <div class="card-body">
                <div class="flex items-center gap-2 mb-4">
                    <span class="text-2xl">🔑</span>
                    <h1 class="text-2xl font-bold">Change Password</h1>
                </div>

                <form id="changePasswordForm" class="space-y-4">
                    <!-- Current Password -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Current Password</span>
                        </label>
                        <input
                            type="password"
                            id="oldPassword"
                            name="old_password"
                            placeholder="Enter your current password"
                            class="input input-bordered"
                            required
                        />
                    </div>

                    <!-- New Password -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">New Password</span>
                        </label>
                        <input
                            type="password"
                            id="newPassword"
                            name="new_password"
                            placeholder="Enter new password (min 8 characters)"
                            class="input input-bordered"
                            minlength="8"
                            required
                        />
                        <label class="label">
                            <span class="label-text-alt text-base-content/60">Minimum 8 characters</span>
                        </label>
                    </div>

                    <!-- Confirm New Password -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Confirm New Password</span>
                        </label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Confirm new password"
                            class="input input-bordered"
                            required
                        />
                    </div>

                    <!-- Error Message -->
                    <div id="errorMessage" class="alert alert-error" style="display: none;">
                        <span id="errorText"></span>
                    </div>

                    <!-- Success Message -->
                    <div id="successMessage" class="alert alert-success" style="display: none;">
                        <span id="successText">Password changed successfully!</span>
                    </div>

                    <!-- Submit Button -->
                    <div class="form-control mt-6">
                        <button type="submit" class="btn btn-primary gap-2">
                            <span>🔐</span>
                            <span>Change Password</span>
                        </button>
                    </div>

                    <!-- Back Link -->
                    <div class="text-center">
                        <a href="/" class="link link-hover text-sm">Back to Home</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Load theme from localStorage
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.querySelector('html').setAttribute('data-theme', savedTheme);

        // Theme toggle
        function toggleTheme() {
            const html = document.querySelector('html');
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Handle form submission
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate on client side
            if (newPassword !== confirmPassword) {
                showError('New passwords do not match');
                return;
            }

            if (newPassword.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }

            // Submit to backend
            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        old_password: oldPassword,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                if (!response.ok) {
                    const data = await response.json();
                    showError(data.error || 'Failed to change password');
                } else {
                    showSuccess('Password changed successfully! Redirecting...');
                    document.getElementById('changePasswordForm').reset();
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error changing password: ' + error.message);
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const successDiv = document.getElementById('successMessage');
            
            errorText.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            const errorDiv = document.getElementById('errorMessage');
            
            successText.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        // Open cache modal (from navbar)
        function openCacheModal() {
            const modal = document.getElementById('cacheModal');
            if (modal) {
                modal.showModal();
            }
        }
    </script>
</body>
</html>
