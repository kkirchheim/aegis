line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long (formatter handles this)
]

[lint.isort]
known-first-party = ["blueprints", "services", "models", "repositories", "schemas", "llm", "utils", "config"]

[format]
quote-style = "double"
