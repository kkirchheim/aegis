<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error - AEGIS</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='aegis.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.0.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
</head>
<body class="bg-base-100">
    {% include "navbar.html" %}

    <div class="flex items-center justify-center min-h-[calc(100vh-80px)]">
        <div class="card w-96 bg-base-200 shadow-lg text-center">
            <div class="card-body">
                <div class="flex justify-center mb-4">
                    <i class="fa-solid fa-burst text-6xl" aria-hidden="true"></i>
                </div>
                
                <h1 class="text-4xl font-bold text-error mb-2">500</h1>
                <h2 class="text-2xl font-semibold mb-4">Server Error</h2>
                
                <p class="text-base-content/70 mb-6">
                    Something went wrong on our end. Our team has been notified and we're working to fix it.
                </p>
                
                <div class="flex gap-2 justify-center">
                    <a href="/" class="btn btn-primary">
                        <i class="fa-solid fa-house" aria-hidden="true"></i>
                        <span>Go Home</span>
                    </a>
                    <a href="/history" class="btn btn-secondary">
                        <i class="fa-solid fa-chart-column" aria-hidden="true"></i>
                        <span>View History</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load theme from localStorage
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.querySelector('html').setAttribute('data-theme', savedTheme);

        // Theme toggle
        function toggleTheme() {
            const html = document.querySelector('html');
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
    </script>
</body>
</html>
