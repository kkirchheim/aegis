<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artifact Review</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-family='system-ui'>📄</text></svg>">
    
    <!-- Tailwind CSS + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.3/dist/full.css" rel="stylesheet" type="text/css" />
    
    <!-- Custom styles -->
    <style>
        /* Override primary color to blue */
        .text-primary { color: #0068b4; }
        .bg-primary { background-color: #0068b4; }
        .btn-primary { background-color: #0068b4; border-color: #0068b4; color: white; }
        .btn-primary:hover { background-color: #004d8f; }
        .btn-primary:disabled { background-color: #0068b4; border-color: #0068b4; color: white; }
        .badge-primary { background-color: #0068b4; border-color: #0068b4; color: white; }
        .link-primary { color: #0068b4; }
        
        /* Secondary button red */
        .btn-secondary { background-color: #ef4444; border-color: #ef4444; color: white; }
        .btn-secondary:hover { background-color: #dc2626; }
        
        /* Override any violet/accent color to blue */
        .badge-accent, .btn-accent, [class*="accent"] {
            background-color: #0068b4 !important;
            border-color: #0068b4 !important;
            color: white !important;
        }
        
        .badge-accent:hover, .btn-accent:hover {
            background-color: #004d8f !important;
            border-color: #004d8f !important;
        }
        
        /* Override any element with background-color of violet to blue */
        [style*="background-color: rgb(148, 0, 255)"],
        [style*="background-color:#9400ff"],
        [style*="background-color: #9400ff"] {
            background-color: #0068b4 !important;
        }
        
        html[data-theme="light"] {
            color-scheme: light;
        }
        
        .upload-area {
            @apply relative border-2 border-dashed border-primary rounded-lg p-8 text-center cursor-pointer transition-all hover:border-primary/80 hover:bg-primary/5;
        }
        
        .upload-area.dragover {
            @apply border-primary/80 bg-primary/10;
        }
        
        #pdfInput {
            @apply hidden;
        }
    </style>
</head>
<body class="bg-base-100">
    {% include 'navbar.html' %}

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        
        <!-- Hero Section -->
        <section class="mb-12 text-center">
            <h1 class="text-4xl font-bold mb-4">Review Software Artifacts</h1>
            <p class="text-xl text-base-content/70 mb-8">
                Upload a scientific paper and get a structured artifact assessment based on collected evidence.
            </p>
        </section>

        <!-- Upload Section -->
        <section id="uploadSection" class="mb-8">
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title flex items-center gap-2">
                        <span>📤</span>
                        <span>Upload PDF</span>
                    </h2>
                    
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="pdfInput" accept=".pdf" style="display: none;" />
                        <label for="pdfInput" class="upload-label cursor-pointer flex flex-col items-center justify-center w-full h-64">
                            <div class="text-7xl">📑</div>
                        </label>
                    </div>
                    
                    <!-- Configuration Options -->
                    <div class="divider my-4"></div>
                    <h3 class="font-semibold mb-3">Analysis Configuration</h3>

                    <div class="mb-4">
                        <label class="label" for="manualArtifactUrls">
                            <span class="label-text">Artifact URL Override</span>
                        </label>
                        <textarea
                            id="manualArtifactUrls"
                            class="textarea textarea-bordered w-full"
                            rows="3"
                            placeholder="Optional: provide one or more artifact URLs, one per line"
                        ></textarea>
                        <label class="label">
                            <span class="label-text-alt">These URLs will be added to any artifacts extracted from the paper.</span>
                        </label>
                    </div>

                    <div class="mb-4">
                        <label class="label" for="agentInstructions">
                            <span class="label-text">Agent Instructions</span>
                        </label>
                        <textarea
                            id="agentInstructions"
                            class="textarea textarea-bordered w-full"
                            rows="3"
                            placeholder="Optional: custom instructions for the agent (e.g. 'Run only the experiments in Table 2', 'Skip the training step')"
                        ></textarea>
                        <label class="label">
                            <span class="label-text-alt">These instructions will be passed to the agent alongside its default workflow.</span>
                        </label>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- Container Selection -->
                        <div>
                            <label class="label">
                                <span class="label-text">Container</span>
                            </label>
                            <select id="dockerImageSelect" class="select select-bordered w-full">
                                <option value="standard">Python (Default)</option>
                                <option value="ml">Python ML (PyTorch, scikit-learn, scipy)</option>
                                <option value="matlab">MATLAB/Octave (GNU Octave, signal, statistics)</option>
                            </select>
                        </div>

                        <!-- Model Selection -->
                        <div>
                            <label class="label">
                                <span class="label-text">Model</span>
                            </label>
                            <select id="modelSelect" class="select select-bordered w-full">
                                <option value="haiku">Haiku (Fast, 80% cheaper)</option>
                                <option value="opus">Opus (Better quality)</option>
                            </select>
                        </div>
                        
                        <!-- CPU Limit -->
                        <div>
                            <label class="label">
                                <span class="label-text">CPU Limit (cores)</span>
                            </label>
                            <input type="number" id="cpuLimit" class="input input-bordered w-full" value="4" min="1" max="16" step="1" />
                        </div>
                        
                        <!-- Memory Limit -->
                        <div>
                            <label class="label">
                                <span class="label-text">Memory Limit (MB)</span>
                            </label>
                            <input type="number" id="memoryLimit" class="input input-bordered w-full" value="4096" min="512" max="32768" step="512" />
                        </div>
                        
                        <!-- Runtime Limit -->
                        <div>
                            <label class="label">
                                <span class="label-text">Runtime Limit (minutes)</span>
                            </label>
                            <input type="number" id="runtimeLimit" class="input input-bordered w-full" value="30" min="5" max="180" step="5" />
                        </div>
                        
                        <!-- Iterations -->
                        <div>
                            <label class="label">
                                <span class="label-text">Max Iterations</span>
                            </label>
                            <input type="number" id="maxIterations" class="input input-bordered w-full" value="15" min="1" max="50" step="1" />
                        </div>
                        
                        <!-- Storage Limit -->
                        <div>
                            <label class="label">
                                <span class="label-text">Storage Limit (GB)</span>
                            </label>
                            <input type="number" id="storageLimit" class="input input-bordered w-full" value="10" min="1" max="100" step="1" />
                        </div>
                    </div>
                    
                    <div class="card-actions justify-end mt-6">
                        <button id="analyzeBtn" class="btn btn-primary gap-2" disabled>
                            <span>🔍</span>
                            <span>Analyze Paper</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- Theme Toggle Script -->
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    </script>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
