<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis History - AEGIS</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='aegis.svg') }}">
    
    <!-- Tailwind CSS + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.3/dist/full.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
    
    <style>
        /* Override primary color to blue */
        .text-primary { color: #0068b4 !important; }
        .bg-primary { background-color: #0068b4 !important; }
        .btn-primary { background-color: #0068b4 !important; border-color: #0068b4 !important; color: white !important; }
        .btn-primary:hover { background-color: #004d8f !important; }
        .btn-primary:disabled { background-color: #0068b4 !important; border-color: #0068b4 !important; color: white !important; }
        .badge-primary { background-color: #0068b4 !important; border-color: #0068b4 !important; color: white !important; }
        .link-primary { color: #0068b4 !important; }
        
        /* Secondary button red */
        .btn-secondary { background-color: #ef4444 !important; border-color: #ef4444 !important; color: white !important; }
        .btn-secondary:hover { background-color: #dc2626 !important; }
        
        /* Progress bar */
        /* Progress bar - filled portion blue, unfilled gray */
        .progress-primary {
            background-color: #e5e7eb !important;
        }
        
        .progress-primary::-webkit-progress-bar {
            background-color: #e5e7eb !important;
        }
        
        .progress-primary::-webkit-progress-value {
            background-color: #0068b4 !important;
        }
        
        .progress-primary::-moz-progress-bar {
            background-color: #0068b4 !important;
        }
        
        /* Override any violet/accent color to blue */
        .badge-accent, .btn-accent, [class*="accent"] {
            background-color: #0068b4 !important;
            border-color: #0068b4 !important;
            color: white !important;
        }
        
        .badge-accent:hover, .btn-accent:hover {
            background-color: #004d8f !important;
            border-color: #004d8f !important;
        }
        
        /* Override any element with background-color of violet to blue */
        [style*="background-color: rgb(148, 0, 255)"],
        [style*="background-color:#9400ff"],
        [style*="background-color: #9400ff"] {
            background-color: #0068b4 !important;
        }
        
        /* Steps component */
        .step-content { text-align: left !important; }
        .steps .step-primary::before, .steps .step-primary::after { background-color: #0068b4 !important; }
        
        html[data-theme="light"] {
            color-scheme: light;
        }
    </style>
</head>
<body class="bg-base-100">
    {% include 'navbar.html' %}

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        
        <!-- Header -->
        <section class="mb-8">
            <h1 class="text-3xl font-bold mb-4">Analysis History</h1>
            <p class="text-base-content/70">Browse and search all your previous analyses</p>
        </section>

        <!-- Search & Filter Section -->
        <section class="mb-8">
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <span>Search & Filter</span>
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Search by paper title or abstract -->
                        <div>
                            <label class="label">
                                <span class="label-text">Search</span>
                            </label>
                            <input type="text" id="searchInput" placeholder="Search by paper title or abstract..." class="input input-bordered w-full" />
                        </div>
                        
                        <!-- Filter by status -->
                        <div>
                            <label class="label">
                                <span class="label-text">Status</span>
                            </label>
                            <select id="statusFilter" class="select select-bordered w-full">
                                <option value="">All</option>
                                <option value="completed">Completed</option>
                                <option value="failed">Failed</option>
                                <option value="processing">Processing</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Sort Options -->
                    <div class="mt-4 flex gap-2 flex-wrap">
                        <span class="text-sm text-base-content/60">Sort by:</span>
                        <button id="sortDate" class="btn btn-sm btn-outline gap-1"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Date</button>
                        <button id="sortName" class="btn btn-sm btn-outline gap-1">A-Z Name</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section>
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title flex items-center gap-2">
                        <i class="fa-solid fa-book-open" aria-hidden="true"></i>
                        <span id="resultCount">Loading...</span>
                    </h2>
                    
                    <!-- Jobs Table -->
                    <div id="jobsList" class="space-y-3">
                        <div class="text-center py-8 text-base-content/60">
                            <div class="loading loading-spinner"></div>
                        </div>
                    </div>
                    
                    <!-- Empty State -->
                    <div id="emptyState" style="display: none;" class="text-center py-12">
                        <div class="text-5xl mb-4"><i class="fa-regular fa-folder-open" aria-hidden="true"></i></div>
                        <p class="text-lg text-base-content/60">No analyses found</p>
                        <p class="text-sm text-base-content/50 mb-4">Try adjusting your filters or <a href="/" class="link link-primary">upload a new paper</a></p>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- Theme Toggle Script -->
    <script>
        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const theme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
            localStorage.setItem('theme', theme);
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
    </script>

    <script src="{{ url_for('static', filename='history.js') }}"></script>
</body>
</html>
